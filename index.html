<style>
:root{
  --paper:#FBFAF8; --card:#FFFFFF; --sideBg:#23201B; --doneBg:#FAF0EF; --doneLine:#F0DEDB; --doneInk:#7C5750; --ink:#33312C; --ink2:#6B675F; --ink3:#A29D93;
  --line:#E4E0D7; --line2:#D4CFC4; --r:12px;
  --hdr:#F0EEE9; --hdrInk:#4A4638; --hdrInk2:#837D6D; --hdrBar:#BDB6A3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb,'DM Sans',-apple-system,Segoe UI,sans-serif);font-weight:var(--wb,400);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.main{zoom:var(--fscale,1)}
h1,h2,h3,.brand,.hero .day,.due .what,.classcard .nm,.appcard .nm3,.qlink span{font-family:var(--fh,inherit);font-weight:var(--wh,500);font-style:var(--hs,normal)}
button,input,select,textarea{font-family:var(--fb,inherit)}
h1,h2,h3{font-weight:500;margin:0}
p{margin:0}
button{font-family:inherit;font-size:13px;white-space:nowrap;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;cursor:pointer;line-height:1.2}
button:hover{background:#F5F3EF}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #8E8778;outline-offset:2px}
button.ghost{background:transparent;border-color:transparent;color:var(--ink2);padding:5px 8px}
button.ghost:hover{background:#F1EFEA}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;width:100%}
input::placeholder,textarea::placeholder{color:var(--ink3)}
.wrap{width:100%;margin:0;padding:0}
.layout{display:flex;min-height:100vh;align-items:stretch}
.side{width:242px;flex:0 0 242px;background:var(--sideBg);color:#EAE6DC;position:sticky;top:0;align-self:flex-start;height:100vh;min-height:100vh;overflow:hidden;padding:26px 14px 18px;display:flex;flex-direction:column}
.sidehide{position:absolute;right:10px;top:26px;background:rgba(255,255,255,.08);border:none;color:#C6C0B4;border-radius:7px;padding:5px 8px;cursor:pointer;line-height:1;font-size:13px}
.sidehide:hover{background:rgba(255,255,255,.16);color:#FFFDF8}
.sideshow{position:fixed;left:16px;top:16px;z-index:65;width:38px;height:38px;border-radius:10px;background:var(--sideBg);border:none;color:#EAE6DC;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;padding:0}
.sideshow svg{width:17px;height:17px;fill:#EAE6DC}
.sideshow:hover{filter:brightness(1.2)}
.me{display:flex;align-items:center;gap:11px;padding:0 10px 20px}
.me .avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0;cursor:pointer;border:1px solid rgba(255,255,255,.2)}
.me .avatarempty{width:42px;height:42px;border-radius:50%;flex-shrink:0;cursor:pointer;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center}
.me .avatarempty svg{width:22px;height:22px;fill:#8E877A}
.me .avatarempty:hover,.me .avatar:hover{opacity:.85}
.brand{font-size:16.5px;font-weight:500;color:#FFFDF8}
.brandsub{font-size:12px;color:#948D80}
.sitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:14px;color:#C6C0B4;cursor:pointer;line-height:1.35}
.sitem:hover{background:rgba(255,255,255,.07);color:#FFFDF8}
.sitem.on{background:rgba(255,255,255,.11);color:#FFFDF8}
.sitem .nm2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickpanel,.modal,.appgrid,.tbl{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.14) transparent}
.pickpanel::-webkit-scrollbar,.modal::-webkit-scrollbar{width:7px}
.pickpanel::-webkit-scrollbar-track,.modal::-webkit-scrollbar-track{background:transparent}
.pickpanel::-webkit-scrollbar-thumb,.modal::-webkit-scrollbar-thumb{background:transparent;border-radius:8px}
.pickpanel:hover::-webkit-scrollbar-thumb,.modal:hover::-webkit-scrollbar-thumb{background:rgba(0,0,0,.14)}
.pickpanel::-webkit-scrollbar-thumb:hover,.modal::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.26)}
.sidescroll{flex:1;overflow-y:auto;min-height:0;margin:0 -4px;padding:0 4px;scrollbar-width:thin;scrollbar-color:transparent transparent}
.sidescroll:hover{scrollbar-color:rgba(255,255,255,.16) transparent}
.sidescroll::-webkit-scrollbar{width:7px}
.sidescroll::-webkit-scrollbar-track{background:transparent}
.sidescroll::-webkit-scrollbar-thumb{background:transparent;border-radius:8px}
.sidescroll:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16)}
.sidescroll::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28)}
.side::-webkit-scrollbar{width:0;height:0}
.side{scrollbar-width:none}
.sidefoot{border-top:1px solid rgba(255,255,255,.13);padding-top:10px;margin-top:10px;flex-shrink:0}
.slabel{font-size:11px;color:#7C7568;padding:22px 10px 7px;letter-spacing:.05em}
.sdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.ssub{margin:3px 0 8px 19px;padding-left:12px;border-left:1px solid rgba(255,255,255,.15)}
.ssub .sitem{font-size:13px;padding:6px 10px;color:#A49D90}
.main{flex:1;min-width:0;background:var(--card)}
.menubtn{display:none;background:rgba(0,0,0,.06);border:none;border-radius:8px;padding:7px 11px;margin-bottom:14px;font-size:13px}
.backdrop{position:fixed;inset:0;background:rgba(28,26,22,.42);z-index:55}
.banner{padding:64px 40px 28px;position:relative}
.banner.sz-medium{padding:38px 40px 22px}
.banner.sz-medium h1{font-size:30px}
.banner.sz-small{padding:20px 40px 14px}
.banner.sz-small h1{font-size:23px;margin-top:3px}
.banner.sz-small .eyebrow{font-size:11px}
.banner.sz-hidden{padding:0;background:transparent!important;min-height:0}
.banner.sz-hidden h1,.banner.sz-hidden .eyebrow,.banner.sz-hidden .sub{display:none}
.banner.sz-hidden.editing{padding:10px 40px;border-bottom:1px dashed var(--line2)}
.banner .hiddennote{font-size:12px;color:var(--ink3)}
.sizebtns{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 4px}
.sizebtns button{font-size:12px;padding:5px 10px}
.sizebtns button.on{background:#33312C;color:#fff;border-color:#33312C}
.eyebrow{font-size:12px;color:var(--hdrInk2)}
.banner h1{font-size:38px;letter-spacing:-.02em;line-height:1.15;color:var(--hdrInk);margin-top:7px}
.banner .sub{font-size:13px;color:var(--hdrInk2);margin-top:4px}
.nav{display:flex;gap:20px;padding:18px 40px 0;flex-wrap:wrap}
.nav span{font-size:13px;color:var(--hdrInk2);padding-bottom:12px;border-bottom:2px solid transparent;cursor:pointer}
.nav span.on{color:var(--hdrInk);border-bottom-color:var(--hdrBar)}
.body{padding:26px 40px 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:26px;align-items:start}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.hero-av{cursor:pointer;flex-shrink:0;display:block}
.avatar-lg{width:66px;height:66px;border-radius:50%;object-fit:cover;display:block;border:1px solid var(--line)}
.avatar-lg.empty{background:#EDEBE5;display:flex;align-items:center;justify-content:center}
.avatar-lg.empty svg{width:34px;height:34px;fill:#B0ABA1}
.hero-av:hover .avatar-lg{opacity:.88}
.hero .day{font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.hero .date{font-size:15px;color:var(--ink2);margin-top:4px}
.wx{position:relative;overflow:hidden;display:flex;align-items:center;gap:13px;border-radius:14px;padding:10px 18px 10px 12px;min-width:250px;background:var(--sideBg);color:#EAE6DC;isolation:isolate}
.wx .wxicon{width:48px;height:48px;flex-shrink:0;display:block}
.wx::before,.wx::after{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none}
.wx .temp{font-size:28px;font-weight:500;line-height:1}
.wx .cond{font-size:13.5px;font-weight:500;line-height:1.3}
.wx .hl{font-size:11.5px;opacity:.8;line-height:1.35}
.wx button{background:transparent;border:1px solid currentColor;color:inherit;font-size:12px;opacity:.8}
.wx.light{color:#2E3438}
.wx.dark{color:#EEF0F2}
.w-clear-day{background:linear-gradient(135deg,#BFD6E4 0%,#DCE7E6 55%,#EFE3C8 100%)}
.w-clear-day::before{background:radial-gradient(circle at 86% 22%,rgba(255,236,190,.95) 0,rgba(255,236,190,.5) 22px,transparent 60px)}
.w-clear-night{background:linear-gradient(160deg,#1E2638 0%,#2C3550 60%,#3A3F5C 100%)}
.w-clear-night::before{background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff 50%,transparent),radial-gradient(1px 1px at 60% 20%,#fff 50%,transparent),radial-gradient(1.5px 1.5px at 80% 60%,#fff 50%,transparent),radial-gradient(1px 1px at 40% 75%,#fff 50%,transparent),radial-gradient(1px 1px at 90% 30%,#fff 50%,transparent);opacity:.7}
.w-clear-night::after{background:radial-gradient(circle at 85% 25%,rgba(240,236,220,.9) 0,rgba(240,236,220,.9) 11px,transparent 13px)}
.w-partly-day{background:linear-gradient(135deg,#C4D3DD 0%,#D9DFE0 60%,#E8E4D8 100%)}
.w-partly-day::before{background:radial-gradient(ellipse 70px 26px at 80% 32%,rgba(255,255,255,.85),transparent 70%),radial-gradient(circle at 88% 20%,rgba(255,236,190,.8) 0,transparent 40px)}
.w-partly-night{background:linear-gradient(160deg,#2A3140 0%,#3A4252 100%)}
.w-partly-night::before{background:radial-gradient(ellipse 70px 26px at 78% 36%,rgba(160,170,185,.35),transparent 70%)}
.w-cloudy{background:linear-gradient(160deg,#C9CDD0 0%,#B6BCC1 100%)}
.w-cloudy::before{background:radial-gradient(ellipse 90px 30px at 75% 30%,rgba(255,255,255,.45),transparent 70%),radial-gradient(ellipse 110px 34px at 30% 85%,rgba(255,255,255,.3),transparent 70%)}
.w-fog{background:linear-gradient(180deg,#D8DADB 0%,#C9CCCE 100%)}
.w-fog::before{background:repeating-linear-gradient(180deg,rgba(255,255,255,.35) 0 6px,transparent 6px 18px)}
.w-rain{background:linear-gradient(170deg,#56657A 0%,#6F7D90 100%)}
.w-rain::before{background:repeating-linear-gradient(105deg,rgba(255,255,255,.22) 0 1px,transparent 1px 11px);background-size:40px 40px;animation:rainfall 1.2s linear infinite}
.w-snow{background:linear-gradient(180deg,#DCE5EC 0%,#C9D5DF 100%)}
.w-snow::before{background-image:radial-gradient(2px 2px at 15% 20%,#fff 60%,transparent),radial-gradient(2.5px 2.5px at 45% 60%,#fff 60%,transparent),radial-gradient(2px 2px at 70% 30%,#fff 60%,transparent),radial-gradient(1.5px 1.5px at 85% 75%,#fff 60%,transparent),radial-gradient(2px 2px at 30% 85%,#fff 60%,transparent);background-size:120px 90px;animation:snowfall 6s linear infinite}
.w-storm{background:linear-gradient(170deg,#3A3848 0%,#54526A 100%)}
.w-storm::before{background:repeating-linear-gradient(105deg,rgba(255,255,255,.16) 0 1px,transparent 1px 10px);background-size:40px 40px;animation:rainfall 1s linear infinite}
.w-storm::after{background:linear-gradient(120deg,transparent 40%,rgba(255,250,220,.18) 50%,transparent 60%);animation:flash 7s ease-in-out infinite}
@keyframes rainfall{from{background-position:0 0}to{background-position:-10px 40px}}
@keyframes snowfall{from{background-position:0 0}to{background-position:20px 90px}}
@keyframes flash{0%,92%,100%{opacity:0}94%{opacity:1}96%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.wx::before,.wx::after{animation:none!important}}
.statbox{background:#F6F4F0;border-radius:12px;overflow:hidden;border:1px solid transparent}
.statbox[open]{background:var(--card);border-color:var(--line2)}
.statbox[open] summary{background:#F6F4F0;border-bottom:1px solid var(--line2)}
.statbox summary{list-style:none;padding:16px 18px;cursor:pointer}
.statbox summary::-webkit-details-marker{display:none}
.statbox summary::marker{content:''}
.statbox .lbl{font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
.statbox .num{font-size:28px;font-weight:500;margin-top:2px}
.statbox .list{padding:4px 18px 14px;background:var(--card);border-radius:0 0 11px 11px}
.srow{display:flex;gap:9px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px}
.srow:first-child{border-top:none}
.srow:hover{color:var(--ink)}
.srow .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;align-self:center}
.srow .sd{font-size:12px;color:var(--ink2);flex-shrink:0;min-width:82px}
.srow .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .pill{align-self:center}
.stat{background:#F6F4F0;border-radius:12px;padding:16px 18px}
.stat p:first-child{font-size:13px;color:var(--ink2)}
.stat p:last-child{font-size:28px;font-weight:500;margin-top:2px}
.rowhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.rowhead h2{font-size:17px}
.seg{display:flex;gap:2px;background:#F1EFEA;border-radius:9px;padding:3px}
.seg button{background:transparent;border:none;padding:5px 12px;border-radius:7px;color:var(--ink2);font-size:12.5px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:13px}
.due,.classcard,.appcard{white-space:normal}
.due{border-radius:14px;padding:18px 20px;cursor:pointer;border:none;border-left:5px solid transparent;text-align:left;width:100%;display:block;min-height:112px}
.due:hover{filter:brightness(.985)}
.due .when{font-size:13px;font-weight:500}
.due .what{font-size:17.5px;font-weight:500;margin-top:5px;line-height:1.35;overflow-wrap:anywhere}
.due .who{font-size:12.5px;margin-top:6px;overflow-wrap:anywhere}
.due.overdue{border-left-color:#A34A3F}
.classcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.cardcover{width:100%;height:86px;object-fit:cover;display:block;border-radius:13px 13px 0 0;margin:-20px -22px 14px;width:calc(100% + 44px)}
.coverwrap{position:relative;width:100%;height:240px;overflow:hidden;background:#EDEBE5}
.pagecover{position:relative;width:100%;height:100%;object-fit:cover;display:block}
.coverblur{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(18px) saturate(.9);opacity:.75}
.coverwrap.repos{cursor:grab}
.coverwrap.repos:active{cursor:grabbing}
.coverhint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(28,26,22,.72);color:#F5F2EC;font-size:12.5px;padding:7px 14px;border-radius:20px;pointer-events:none}
.coverbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 40px;background:#F6F4F0;border-bottom:1px solid var(--line)}
.coverbar input[type=range]{width:170px}
.coverbar .lbl2{font-size:12.5px;color:var(--ink2)}
@media(max-width:700px){
  .body{padding:18px 16px 70px}
  .banner{padding-left:16px!important;padding-right:16px!important}
  .banner{padding-top:calc(env(safe-area-inset-top,0px) + 18px)}
  .banner.sz-large{padding-top:calc(env(safe-area-inset-top,0px) + 30px)}
  .banner.sz-hidden{padding-top:env(safe-area-inset-top,0px)}

  .wx{min-width:0;width:100%}
  .stats{grid-template-columns:1fr}
  .cards,.classcards,.appgrid{grid-template-columns:1fr 1fr}
  .classcards{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .two,.two2,.split{grid-template-columns:1fr!important}
  .rail{position:static;flex-direction:column}
  .rowhead{flex-wrap:wrap}
  .tick{width:22px;height:22px}
  .x{padding:8px 10px;font-size:18px}
  button,.fakebtn{min-height:38px}
  button.ghost{min-height:34px}
  .item{padding:9px 0}
  .tbl thead{display:none}
  .tbl,.tbl tbody{display:block}
  .tbl tr{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .tbl td{border:none;padding:0}
  .tbl td:nth-child(1){order:0}
  .tbl td:nth-child(2){flex:1 1 60%;order:1}
  .tbl td:nth-child(3),.tbl td:nth-child(4),.tbl td:nth-child(5),.tbl td:nth-child(6){order:2;font-size:12.5px;color:var(--ink2)}

  .modalbg{align-items:flex-end;padding:0}
  .modal{max-width:none;width:100%;border-radius:18px 18px 0 0;max-height:90vh;overflow-y:auto;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px)}
  .pickpanel{left:0!important;right:0!important;top:auto!important;bottom:0!important;width:100%!important;max-height:72vh;border-radius:18px 18px 0 0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
  .pickbtn{right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
  .coverwrap{max-height:190px}
  .pencil{width:30px;height:30px}
  .search input{font-size:16px}
  input,select,textarea{font-size:16px}
  .quick{gap:8px}
  .qlink{padding:9px 12px;font-size:14px}
}
@media(max-width:720px){.coverwrap{height:170px}.coverbar{padding:12px 18px}}
.classcard{display:flex!important;flex-direction:column;justify-content:flex-start;align-items:stretch;border:1px solid var(--line);border-radius:14px;padding:20px 22px;overflow:hidden;cursor:pointer;background:var(--card);text-align:left;display:block;width:100%;min-height:132px}
.classcard:hover{background:#FAF8F5;border-color:var(--line2)}
.bar{display:block;width:40px;height:7px;border-radius:4px;margin-bottom:14px}
.classcard .nm{font-size:17px;font-weight:500;line-height:1.3;display:block;overflow-wrap:anywhere}
.classcard .meta{font-size:12.5px;color:var(--ink3);margin-top:5px}
.panel{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.panel h3{font-size:14.5px;margin-bottom:11px}
h2,h3,.rowhead h2{color:var(--head,var(--ink))}
.item a,.qlink span,.srow .grow{color:var(--link,inherit)}
.two{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;margin-bottom:12px}
.two2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.item{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px;border-bottom:1px solid #F3F1EC}
.item:last-child{border-bottom:none}
.item .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item a{color:inherit;text-decoration:none}
.item a:hover{text-decoration:underline}
.tick{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line2);flex-shrink:0;cursor:pointer;background:transparent;padding:0}

.done{color:var(--ink3);text-decoration:line-through}
.tag{font-size:11px;color:var(--ink3);flex-shrink:0}

.fakebtn:hover{background:#F5F3EF}
.asg{border:1px solid var(--line);border-left-width:4px;border-radius:10px;margin-bottom:9px;background:var(--card)}
.asg summary{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer;list-style:none;font-size:15px}
.asg summary::-webkit-details-marker{display:none}

function parseISO(s){if(!s)return null;var p=s.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);d.setHours(0,0,0,0);return d}
function daysBetween(a,b){return Math.round((b-a)/86400000)}
function fmtTime(t){
 if(!t)return '';
 var p=String(t).split(':'),h=+p[0],m=p[1]||'00';
 var ap=h>=12?'PM':'AM',hh=h%12;if(hh===0)hh=12;
 return hh+(m==='00'?'':':'+m)+' '+ap;
}
function withTime(str,t){return t?str+' \u00b7 '+fmtTime(t):str}
function timeAgo(iso){
 var d=new Date(iso),diff=(Date.now()-d.getTime())/1000;
 if(diff<60)return 'just now';
 if(diff<3600)return Math.floor(diff/60)+' min ago';
 if(diff<86400)return Math.floor(diff/3600)+' hr ago';
 return d.toLocaleDateString('en-CA',{month:'short',day:'numeric'})+' at '+d.toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'});
}
function fmtDue(s){var d=parseISO(s);if(!d)return '';var n=daysBetween(today(),d);
 if(n===0)return 'Due today';if(n===1)return 'Tomorrow';if(n===-1)return 'Yesterday';
 if(n<0)return Math.abs(n)+' days late';if(n<7)return d.toLocaleDateString('en-CA',{weekday:'long'});
 return d.toLocaleDateString('en-CA',{month:'short',day:'numeric'})}

function weekStart(offset){
 var t=today(),d=new Date(t);
 d.setDate(t.getDate()-((t.getDay()+6)%7)+(offset||0)*7);
 return d;
}

function parseTime(txt){
 if(!txt)return '';
 var m=/due\s+(\d{1,2})(?::(\d{2}))?\s*([AaPp])\.?[Mm]/.exec(txt);
 if(!m){
  var all=txt.match(/(\d{1,2})(?::(\d{2}))?\s*[AaPp]\.?[Mm]/g);
  if(!all)return '';
  m=/(\d{1,2})(?::(\d{2}))?\s*([AaPp])/.exec(all[all.length-1]);
 }
 if(!m)return '';
 var h=+m[1],min=m[2]||'00',pm=/p/i.test(m[3]);
 if(pm&&h<12)h+=12;
 if(!pm&&h===12)h=0;
 return (h<10?'0':'')+h+':'+min;
}

function gradeInfo(c){
 var list=(c.assignments||[]).filter(function(a){return a.weight!==''&&a.weight!=null&&+a.weight>0});
 var total=0,earned=0,graded=0;
 list.forEach(function(a){
  total+=+a.weight;
  if(a.mark!==''&&a.mark!=null){graded+=+a.weight;earned+=(+a.mark)*(+a.weight)/100}
 });
 var avg=graded?earned/graded*100:null;
 var remaining=total-graded,need=null;
 if(c.target&&remaining>0){need=(c.target*total/100-earned)/remaining*100}
 return {total:total,graded:graded,earned:earned,avg:avg,remaining:remaining,need:need};
}

// items that were seeded without an id get a deterministic one (same content => same id on every device),
// so two devices never end up with duplicates of the same seeded item
function detId(o){
 var s=(o.title||o.name||'')+'|'+(o.url||o.due||'')+'|'+(o.email||'');
 var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0}
 return 'g'+(h>>>0).toString(36);
}
function ensureIds(){

   (c[l]||[]).forEach(function(x){if(x.id)used[x.id]=1});
   (c[l]||[]).forEach(function(x){
    if(x.id)return;
    var id=detId(x),n=1;
    while(used[id]){n++;id=detId(x)+'-'+n}
    used[id]=1;x.id=id;
   });
  });
 });
}

var LOCAL=!(window.storage&&window.storage.get);
function sget(k){
 if(!LOCAL)return window.storage.get(k);
 var v=localStorage.getItem(k);
 return v===null?Promise.reject(new Error('missing')):Promise.resolve({key:k,value:v});
}
function sset(k,v){
 if(!LOCAL)return window.storage.set(k,v);
 try{localStorage.setItem(k,v);return Promise.resolve({key:k,value:v})}
 catch(e){return Promise.reject(e)}
}
function sdel(k){
 if(!LOCAL){try{return window.storage.delete(k)}catch(e){return Promise.resolve()}}
 try{localStorage.removeItem(k)}catch(e){}
 return Promise.resolve();
}
var CHUNK=2400000;
var IDB=null;
var idbReady=(function(){
 return new Promise(function(res){
  var req;
  try{if(!window.indexedDB)return res(null);req=window.indexedDB.open('hub-files',1)}
  catch(e){return res(null)}
  req.onupgradeneeded=function(){try{req.result.createObjectStore('files')}catch(e){}};
  req.onsuccess=function(){IDB=req.result;res(IDB)};
  req.onerror=function(){res(null)};
  req.onblocked=function(){res(null)};
  setTimeout(function(){res(IDB)},3000);
 });
})();
function idbDo(mode,fn){
 return new Promise(function(res,rej){
  if(!IDB)return rej(new Error('no idb'));
  var tx=IDB.transaction('files',mode),st=tx.objectStore('files'),r=fn(st);
  r.onsuccess=function(){res(r.result)};
  r.onerror=function(){rej(r.error)};
 });
}

/* ---------- change tracking: stamps edits and records deletions so both sync ---------- */
var LISTS=['assignments','tasks','contacts','links','sections'];
var CLASS_KEYS=['name','code','short','day','room','color','claude','target','cover','coverPos','coverZoom','coverFit','textbook'];
var SEEN=null;
var TOMB_DAYS=180;
function fp(o){return JSON.stringify(o,function(k,v){return k==='savedAt'?undefined:v})}
function walkState(cb){
 (S.classes||[]).forEach(function(c){
  var o={};CLASS_KEYS.forEach(function(k){o[k]=c[k]});
  cb('c:'+c.id,c,fp(o));
  LISTS.forEach(function(l){(c[l]||[]).forEach(function(x){if(x.id)cb('i:'+c.id+':'+l+':'+x.id,x,fp(x))})});
 });
}
var SETTINGS_SEEN=null;
function settingsFp(){var o={};SETTINGS_KEYS.forEach(function(k){o[k]=S[k]});return JSON.stringify(o)}
function rebaseline(){SEEN={};walkState(function(k,o,j){SEEN[k]=j});SETTINGS_SEEN=settingsFp()}
function trackChanges(){
 if(!SEEN){rebaseline();return}
 var now=new Date().toISOString(),cur={};
 S.deleted=S.deleted||{};
 var sf=settingsFp();
 if(sf!==SETTINGS_SEEN){S.settingsSavedAt=now;SETTINGS_SEEN=sf}
 walkState(function(k,o,j){
  cur[k]=1;
  if(!(k in SEEN)){if(!o.savedAt)o.savedAt=now}
  else if(SEEN[k]!==j)o.savedAt=now;
  SEEN[k]=j;
 });
 Object.keys(SEEN).forEach(function(k){
  if(cur[k])return;
  delete SEEN[k];
  if(k.charAt(0)==='i'&&!classById(k.split(':')[1]))return; // whole class deleted: its own record covers the items
  S.deleted[k]=now;
 });
}
function save(){
 trackChanges();
 scheduleDriveSync();

}
async function saveFiles(cid){
 var list=FILES[cid]||[];
 for(var i=0;i<list.length;i++){
  var f=list[i];
  if(f.saved||!f.data)continue;
  await idbReady;
  if(IDB){
   try{await idbDo('readwrite',function(st){return st.put(f.data,f.id)});f.saved=true;f.store='idb';f.chunks=0;continue}
   catch(e){}
  }
  var n=0,ok=true;
  for(var j=0;j<f.data.length;j+=CHUNK){
   try{await sset('hub:fd:'+f.id+':'+n,f.data.slice(j,j+CHUNK))}
   catch(e){ok=false;break}
   n++;
  }
  if(ok){f.saved=true;f.chunks=n;f.store='keys'}
  else{
   f.saved=false;f.chunks=0;
   for(var k=0;k<n;k++)sdel('hub:fd:'+f.id+':'+k);
  }
 }
 var index=list.map(function(f){return {id:f.id,name:f.name,section:f.section,kind:f.kind,ext:f.ext,mime:f.mime,text:f.text,text:f.text,chunks:f.saved?f.chunks:0,store:f.store,saved:!!f.saved}});
 try{await sset('hub:files:'+cid,JSON.stringify(index))}catch(e){}
 render();
}
async function loadFiles(cid){
 var out=[];
 try{
  var r=await sget('hub:files:'+cid);
  var index=JSON.parse(r.value);
  for(var i=0;i<index.length;i++){
   var f=index[i],data='';
   if(f.store==='idb'){
    await idbReady;
    try{data=(await idbDo('readonly',function(st){return st.get(f.id)}))||''}catch(e){data=''}
   }else{
    for(var n=0;n<(f.chunks||0);n++){
     try{var c=await sget('hub:fd:'+f.id+':'+n);data+=c.value}catch(e){data='';break}
    }
   }
   f.data=data;f.saved=!!data;
   out.push(f);
  }
 }catch(e){}
 FILES[cid]=out;
}
async function dropFile(cid,i){
 var f=FILES[cid][i];
 if(f.store==='idb'){await idbReady;try{await idbDo('readwrite',function(st){return st.delete(f.id)})}catch(e){}}
 for(var n=0;n<(f.chunks||0);n++)await sdel('hub:fd:'+f.id+':'+n);
 FILES[cid].splice(i,1);
 saveFiles(cid);
}

 for(var i=0;i<S.classes.length;i++){
  var cid=S.classes[i].id;
  await loadFiles(cid);
 }
 render();
}

function wxType(w){
 var c=w.code,day=w.day!==false;
 if(c==null){
  var t=(w.cond||'').toLowerCase();
  if(/thunder|storm/.test(t))return 'storm';
  if(/snow|flurr/.test(t))return 'snow';
  if(/rain|drizzle|shower/.test(t))return 'rain';
  if(/fog|mist|haze/.test(t))return 'fog';
  if(/partly|mostly clear|some cloud/.test(t))return day?'partly-day':'partly-night';
  if(/cloud|overcast/.test(t))return 'cloudy';
  return day?'clear-day':'clear-night';
 }
 if(c>=95)return 'storm';
 if((c>=71&&c<=77)||c===85||c===86)return 'snow';
 if((c>=51&&c<=67)||(c>=80&&c<=82))return 'rain';
 if(c===45||c===48)return 'fog';
 if(c===3)return 'cloudy';
 if(c===2)return day?'partly-day':'partly-night';
 return day?'clear-day':'clear-night';
}

 var y=base.getFullYear(),m=base.getMonth();
 var first=new Date(y,m,1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
 var label=first.toLocaleDateString('en-CA',{month:'long',year:'numeric'});

 h+='<table class="cal"><thead><tr>'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(d){return '<th>'+d+'</th>'}).join('')+'</tr></thead><tbody>';
 var cur=new Date(start),tstr=iso(today());
 for(var w=0;w<6;w++){
  h+='<tr>';
  for(var d=0;d<7;d++){
   var k=iso(cur),off=cur.getMonth()!==m;
   h+='<td class="'+(off?'off':'')+(k===tstr?' today':'')+'"><span class="dnum">'+cur.getDate()+'</span>';
   (byDay[k]||[]).forEach(function(x){
    var p=pal(x.c.color);
    h+='<div class="chip" style="background:'+p.bg+';color:'+p.ink+(x.t.done?';opacity:.5;text-decoration:line-through':'')+'" data-open="'+x.c.id+'">'+esc(x.t.title)+'</div>';
   });
   h+='</td>';
   cur.setDate(cur.getDate()+1);
  }
  h+='</tr>';
  if(cur.getMonth()!==m&&w>=4)break;
 }
 return h+'</tbody></table>';
}

function findAsg(cid,id){var c=classById(cid);for(var i=0;i<c.assignments.length;i++){if(c.assignments[i].id===id)return c.assignments[i]}return null}
function openModal(kind,classId,id){
 view.modal={kind:kind,classId:classId,id:id||null,color:classId&&kind==='class'?classById(classId).color:'lavender'};
 render();
 setTimeout(function(){var el=document.getElementById('m1');if(el)el.focus()},30);
}
function closeModal(){view.modal=null;render()}
function val(id){var e=document.getElementById(id);return e?e.value.trim():''}

function saveModal(){
 var m=view.modal;
 if(m.kind==='task'){
  var t=val('m1');if(!t)return;
  classById(m.classId).tasks.push(touch({id:uid(),title:t,due:val('m2'),done:false}));
 }else if(m.kind==='assign'){
  var ti=val('m1');if(!ti)return;
  var fid=val('m10')||(view.modal.pendingFileId||'');
  if(m.id){var a=findAsg(m.classId,m.id);a.title=ti;a.due=val('m2');a.notes=val('m3');a.priority=val('m6');a.time=val('m7');a.fileId=fid;a.weight=val('m14')===''?'':+val('m14');a.mark=val('m15')===''?'':+val('m15');touch(a)}
  else{classById(m.classId).assignments.push(touch({id:uid(),title:ti,due:val('m2'),time:val('m7'),notes:val('m3'),priority:val('m6'),fileId:fid,weight:val('m14')===''?'':+val('m14'),mark:val('m15')===''?'':+val('m15'),done:false}))}
 }else if(m.kind==='app'){
  var an=val('m1'),au=val('m2');if(!an||!au)return;
  if(!/^https?:\/\//i.test(au))au='https://'+au;
  S.apps=S.apps||[];
  var ico=view.modal.pendingIcon;
  if(m.id){var ap2=appById(m.id);ap2.title=an;ap2.url=au;if(ico!==undefined)ap2.icon=ico}
  else S.apps.push({id:uid(),title:an,url:au,icon:ico||''});
 }else if(m.kind==='section'){
  var sn=val('m1');if(!sn)return;
  var sc=classById(m.classId);
  sc.sections=sc.sections||[];
  sc.sections.push(touch({id:uid(),name:sn}));
 }else if(m.kind==='book'){
  var cbx=classById(m.classId),bn=val('m1'),bu=val('m2');
  var existing=cbx.textbook||null;
  var cov=view.modal.pendingCover!==undefined?view.modal.pendingCover:(existing?existing.icon||'':'');
  if(bu){
   if(!/^https?:\/\//i.test(bu))bu='https://'+bu;
   cbx.textbook={type:'link',title:bn||'Course textbook',url:bu,icon:cov};
  }else if(existing){
   existing.title=bn||existing.title;existing.icon=cov;
  }else return;
  save();closeModal();window.scrollTo({top:0,behavior:'smooth'});return;
 }else if(m.kind==='link'){
  var n=val('m1'),u=val('m2');if(!n||!u)return;
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  classById(m.classId).links.push(touch({id:uid(),title:n,url:u}));
 }else if(m.kind==='contact'){
  var c=classById(m.classId||val('m8'));
  if(!c)return;
  if(m.id){var ct=contactById(c,m.id);ct.name=val('m1');ct.role=val('m5');ct.email=val('m2');ct.office=val('m3');ct.hours=val('m4');touch(ct)}
  else{
   var nm=val('m1');if(!nm&&!val('m2'))return;
   c.contacts.push(touch({id:uid(),name:nm,role:val('m5'),email:val('m2'),office:val('m3'),hours:val('m4'),photo:''}));
  }
 }else if(m.kind==='class'){
  var cn=val('m1');if(!cn)return;
  if(m.classId){var cc=classById(m.classId);cc.name=cn;cc.code=val('m2');cc.day=val('m3');cc.room=val('m9');cc.claude=val('m11');cc.short=val('m12');cc.target=val('m13')?+val('m13'):'';cc.color=m.color}
  else{S.classes.push({id:uid(),name:cn,code:val('m2'),day:val('m3'),room:val('m9'),claude:val('m11'),color:m.color,contacts:[],assignments:[],tasks:[],links:[]})}
 }
 save();closeModal();
}

async function inflateRaw(bytes){

async function unzip(bytes){
 var dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),end=-1;
 for(var i=bytes.length-22;i>=0&&i>bytes.length-66000;i--){
  if(dv.getUint32(i,true)===0x06054b50){end=i;break}
 }
 if(end<0)throw new Error('not a zip');
 var count=dv.getUint16(end+10,true),off=dv.getUint32(end+16,true),out={};
 for(var n=0;n<count;n++){
  if(dv.getUint32(off,true)!==0x02014b50)break;
  var method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true);
  var nlen=dv.getUint16(off+28,true),elen=dv.getUint16(off+30,true),clen=dv.getUint16(off+32,true);
  var lho=dv.getUint32(off+42,true);
  var name=new TextDecoder().decode(bytes.subarray(off+46,off+46+nlen));
  var lnlen=dv.getUint16(lho+26,true),lelen=dv.getUint16(lho+28,true);
  var start=lho+30+lnlen+lelen,chunk=bytes.subarray(start,start+csize);
  if(/\.xml$/i.test(name)&&(method===0||method===8)){
   try{out[name]=method===8?await inflateRaw(chunk):chunk}catch(e){}
  }
  off+=46+nlen+elen+clen;
 }
 return out;
}
function xmlText(u8,tag){
 var xml=new TextDecoder().decode(u8),re=new RegExp('<'+tag+'[^>]*>([\\s\\S]*?)</'+tag+'>','g'),m,out=[];
 while((m=re.exec(xml))){
  out.push(m[1].replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&apos;/g,"'"));
 }
 return out;
}
async function officeText(file,kind){

  var names=Object.keys(files).filter(function(n){return /^ppt\/slides\/slide\d+\.xml$/.test(n)})
   .sort(function(a,b){return (+a.replace(/\D/g,''))-(+b.replace(/\D/g,''))});
  names.forEach(function(n,i){
   var t=xmlText(files[n],'a:t').join(' ').replace(/\s+/g,' ').trim();
   if(t)text+='Slide '+(i+1)+': '+t+'\n\n';
  });
 }else{

function readFile(file){

  var r=new FileReader();
  r.onerror=function(){rej()};
  if(/^text\/|json|csv/.test(file.type)||/\.(txt|md|csv)$/i.test(file.name)){
   r.onload=function(){res({id:uid(),name:file.name,kind:'text',ext:extOf(file.name),text:String(r.result).slice(0,60000)})};
   r.readAsText(file);
  }else if(/^image\//.test(file.type)){
   shrinkImage(file,1800,function(url){
    res({id:uid(),name:file.name,kind:'image',ext:extOf(file.name),mime:'image/jpeg',data:url.split(',')[1]});
   });
  }else{
   r.onload=async function(){

    var ext=extOf(file.name);
    var kind=file.type==='application/pdf'?'pdf':'other';
    var rec={id:uid(),name:file.name,kind:kind,ext:ext,mime:file.type,data:b64};
    if(kind==='pdf'){

  }
 });

function shrinkImage(file,max,cb,keepAlpha){

  var img=new Image();
  img.onload=function(){
   var s=Math.min(1,max/Math.max(img.width,img.height));
   var cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;
   cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
   cb(keepAlpha?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',max>1000?0.88:0.82));

var dragState=null;
function coverPoint(e){return e.touches&&e.touches[0]?e.touches[0].clientY:e.clientY}
var panelDrag=null;
function startPanelDrag(e){
 var hd=e.target.closest&&e.target.closest('[data-pickdrag]');
 if(!hd)return;
 var panel=hd.closest('.pickpanel'),r=panel.getBoundingClientRect();
 panelDrag={dx:(e.touches?e.touches[0].clientX:e.clientX)-r.left,dy:(e.touches?e.touches[0].clientY:e.clientY)-r.top,el:panel};
 e.preventDefault();
}
function movePanelDrag(e){
 if(!panelDrag)return;
 var x=(e.touches?e.touches[0].clientX:e.clientX)-panelDrag.dx;
 var y=(e.touches?e.touches[0].clientY:e.clientY)-panelDrag.dy;
 x=Math.max(6,Math.min(window.innerWidth-120,x));
 y=Math.max(6,Math.min(window.innerHeight-60,y));
 view.pickPos={x:Math.round(x),y:Math.round(y)};
 panelDrag.el.style.left=view.pickPos.x+'px';
 panelDrag.el.style.top=view.pickPos.y+'px';
 panelDrag.el.style.right='auto';panelDrag.el.style.bottom='auto';
 e.preventDefault();
}
function endPanelDrag(){panelDrag=null}
function startDrag(e){
 var wrap=e.target.closest&&e.target.closest('.coverwrap.repos');
 if(!wrap)return;
 var owner=coverOwner(wrap.dataset.repos);
 if(!owner)return;
 dragState={wrap:wrap,owner:owner,y:coverPoint(e),start:owner.coverPos==null?50:owner.coverPos};
 e.preventDefault();
}
function moveDrag(e){
 if(!dragState)return;
 var dy=coverPoint(e)-dragState.y;
 var next=Math.max(0,Math.min(100,dragState.start-dy*0.35));
 dragState.owner.coverPos=Math.round(next);
 var img=dragState.wrap.querySelector('img');
 if(img)img.style.objectPosition='50% '+dragState.owner.coverPos+'%';
 e.preventDefault();
}
function endDrag(){if(dragState){dragState=null;save()}}
document.addEventListener('mousedown',function(e){startPanelDrag(e);startDrag(e)});
document.addEventListener('mousemove',function(e){movePanelDrag(e);moveDrag(e)});
document.addEventListener('mouseup',function(){endPanelDrag();endDrag()});
document.addEventListener('touchstart',function(e){startPanelDrag(e);startDrag(e)},{passive:false});
