async function inflateRaw(bytes){
 if(typeof DecompressionStream==='undefined')throw new Error('no decompressor');
 var ds=new DecompressionStream('deflate-raw');
 var stream=new Blob([bytes]).stream().pipeThrough(ds);
 return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unzip(bytes){
 var dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),end=-1;
 for(var i=bytes.length-22;i>=0&&i>bytes.length-66000;i--){
  if(dv.getUint32(i,true)===0x06054b50){end=i;break}
 }
 if(end<0)throw new Error('not a zip');
 var count=dv.getUint16(end+10,true),off=dv.getUint32(end+16,true),out={};
 for(var n=0;n<count;n++){
  if(dv.getUint32(off,true)!==0x02014b50)break;
  var method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true);
  var nlen=dv.getUint16(off+28,true),elen=dv.getUint16(off+30,true),clen=dv.getUint16(off+32,true);
  var lho=dv.getUint32(off+42,true);
  var name=new TextDecoder().decode(bytes.subarray(off+46,off+46+nlen));
  var lnlen=dv.getUint16(lho+26,true),lelen=dv.getUint16(lho+28,true);
  var start=lho+30+lnlen+lelen,chunk=bytes.subarray(start,start+csize);
  if(/\.xml$/i.test(name)&&(method===0||method===8)){
   try{out[name]=method===8?await inflateRaw(chunk):chunk}catch(e){}
  }
  off+=46+nlen+elen+clen;
 }
 return out;
}
function xmlText(u8,tag){
 var xml=new TextDecoder().decode(u8),re=new RegExp('<'+tag+'[^>]*>([\\s\\S]*?)</'+tag+'>','g'),m,out=[];
 while((m=re.exec(xml))){
  out.push(m[1].replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&apos;/g,"'"));
 }
 return out;
}
async function officeText(file,kind){
 var buf=new Uint8Array(await file.arrayBuffer());
 var files=await unzip(buf);
 var text='';
 if(kind==='pptx'){
  var names=Object.keys(files).filter(function(n){return /^ppt\/slides\/slide\d+\.xml$/.test(n)})
   .sort(function(a,b){return (+a.replace(/\D/g,''))-(+b.replace(/\D/g,''))});
  names.forEach(function(n,i){
   var t=xmlText(files[n],'a:t').join(' ').replace(/\s+/g,' ').trim();
   if(t)text+='Slide '+(i+1)+': '+t+'\n\n';
  });
 }else{
  var doc=files['word/document.xml'];
  if(doc)text=xmlText(doc,'w:t').join(' ').replace(/\s+/g,' ').trim();
 }
 return text.slice(0,60000);
}
function extOf(n){var p=String(n).split('.');return p.length>1?p.pop().toLowerCase().slice(0,5):''}
var READABLE={pdf:1,image:1,text:1};
function canRead(f){return !!(READABLE[f.kind]||f.text)}
function readFile(file){
 return new Promise(function(res,rej){
  var r=new FileReader();
  r.onerror=function(){rej()};
  if(/^text\/|json|csv/.test(file.type)||/\.(txt|md|csv)$/i.test(file.name)){
   r.onload=function(){res({id:uid(),name:file.name,kind:'text',ext:extOf(file.name),text:String(r.result).slice(0,60000)})};
   r.readAsText(file);
  }else if(/^image\//.test(file.type)){
   shrinkImage(file,1800,function(url){
    res({id:uid(),name:file.name,kind:'image',ext:extOf(file.name),mime:'image/jpeg',data:url.split(',')[1]});
   });
  }else{
   r.onload=async function(){
    var b64=String(r.result).split(',')[1];
    var ext=extOf(file.name);
    var kind=file.type==='application/pdf'?'pdf':'other';
    var rec={id:uid(),name:file.name,kind:kind,ext:ext,mime:file.type,data:b64};
    if(kind==='pdf'){
     try{rec.text=await pdfText(b64)}catch(e){}
    }
    res(rec);
   };
   r.readAsDataURL(file);
  }
 });
}

/* "Replace with an edited copy": mark up a PDF (or image) outside Doable -- Markup on iPad/iPhone, Preview on a Mac, Adobe -- then
   bring the marked-up file back in under the SAME file entry, so it stays one file (no duplicate, no extra storage: the old
   content is overwritten at the same cloud path) and the same class, section and position in the list. */
function replaceFilePick(cid,i){
 var f=(FILES[cid]||[])[i];if(!f)return;

  var file=inp.files&&inp.files[0];inp.remove();

 });

}
async function replaceFile(cid,i,file){

 var fresh;

function shrinkImage(file,max,cb,keepAlpha){
 var r=new FileReader();
 r.onload=function(){
  var img=new Image();
  img.onload=function(){
   var s=Math.min(1,max/Math.max(img.width,img.height));
   var cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;
   cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
   cb(keepAlpha?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',max>1000?0.88:0.82));
  };
  img.src=String(r.result);
 };
 r.readAsDataURL(file);
}

 if(!hd)return;
 var panel=hd.closest('.pickpanel'),r=panel.getBoundingClientRect();
 panelDrag={dx:(e.touches?e.touches[0].clientX:e.clientX)-r.left,dy:(e.touches?e.touches[0].clientY:e.clientY)-r.top,el:panel,sheet:window.innerWidth<=700};

 y=Math.max(6,Math.min(window.innerHeight-60,y));
 view.pickPos={x:Math.round(x),y:Math.round(y)};
 panelDrag.el.style.left=view.pickPos.x+'px';

/* ---------- redraws keep your place: panel scroll, popup scroll and the field you are typing in ---------- */
(function(){
 var raw=render;
 /* iPhone/iPad: a whole-page redraw that lands while your finger is on the glass or the page is still
    gliding can throw the scroll position back to the top. Redraws that come from background work
    (sync finishing, a file downloading -- never from a tap, which happens inside an event) now wait
    until scrolling has settled, and every redraw of the same page puts you back where you were. */
 var touching=false,touchAt=0,lastScroll=0,deferred=null,lastKey='';
 window.addEventListener('scroll',function(){lastScroll=Date.now()},{passive:true});
 document.addEventListener('touchstart',function(){touching=true;touchAt=Date.now()},{passive:true,capture:true});
 document.addEventListener('touchend',function(e){if(!e.touches||!e.touches.length){touching=false;lastScroll=Date.now()}},{passive:true,capture:true});
 document.addEventListener('touchcancel',function(){touching=false;lastScroll=Date.now()},{passive:true,capture:true});
 function busy(){return (touching&&Date.now()-touchAt<8000)||Date.now()-lastScroll<450} // 8s cap: a missed touchend can't freeze redraws
 function later(){clearTimeout(deferred);deferred=setTimeout(function(){deferred=null;if(busy())later();else render()},250)}
 render=function(){
  if(!window.event&&busy()){later();return}
  clearTimeout(deferred);deferred=null;
  var key=view.page+':'+(view.classId||''),y=window.scrollY,same=key===lastKey;
  lastKey=key;
  var keep=[];
  ['.pickpanel','.modal','.cpis'].forEach(function(sel){var el=document.querySelector(sel);if(el&&el.scrollTop)keep.push([sel,el.scrollTop])});
  // anything typed into an open popup survives a redraw (a sync finishing in the background used to
  // rebuild the popup from scratch and wipe what you had typed, e.g. a link's name and address)
  var typed=null,modalNow=view.modal;
  if(modalNow){typed={};document.querySelectorAll('.modal input[id],.modal textarea[id],.modal select[id]').forEach(function(f){if(f.type!=='file'&&f.type!=='checkbox'&&f.type!=='radio')typed[f.id]=f.value})}
  var ae=document.activeElement,field=null;
  if(ae&&ae.id&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){
   field={id:ae.id};try{field.s=ae.selectionStart;field.e=ae.selectionEnd}catch(e){}
  }
  raw.apply(this,arguments);
  if(typed&&view.modal===modalNow)Object.keys(typed).forEach(function(id){var f=document.getElementById(id);if(f&&f.closest('.modal')&&f.value!==typed[id])f.value=typed[id]});
  if(same&&Math.abs(window.scrollY-y)>1){window.scrollTo(0,y)}
  if(same)requestAnimationFrame(function(){if(lastKey===key&&!busy()&&Math.abs(window.scrollY-y)>1)window.scrollTo(0,y)});
  keep.forEach(function(k){var el=document.querySelector(k[0]);if(el)el.scrollTop=k[1]});
  try{musicSync()}catch(e){}
  fitLines();
  // phone: the week strip scrolls sideways; start it at today
  var hw=document.querySelector('.hweek');if(hw&&hw.scrollWidth>hw.clientWidth+4){var hon=hw.querySelector('.hwd.on');if(hon)hw.scrollLeft=Math.max(0,hon.offsetLeft-hw.offsetLeft-16)}
  if(field){
   var el=document.getElementById(field.id);
   if(el&&el!==document.activeElement){try{el.focus({preventScroll:true});if(field.s!=null)el.setSelectionRange(field.s,field.e)}catch(e){}}
  }
 };
})();
